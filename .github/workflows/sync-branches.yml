name: Sync Branches with Main

on:
  workflow_dispatch:
    inputs:
      branch_filter:
        description: 'Comma-separated branches to sync (leave blank for all non-main branches)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (report only, no pushes)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-branches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover-branches:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.discover.outputs.branches }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover branches to sync
        id: discover
        run: |
          set -euo pipefail
          git fetch origin --prune

          ALL_BRANCHES=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
            | sed 's|^origin/||' \
            | grep -vE '^(main|HEAD)$')

          FILTER="${{ github.event.inputs.branch_filter }}"

          if [ -n "$FILTER" ]; then
            IFS=',' read -ra WANTED <<< "$FILTER"
            SELECTED=()
            for b in "${WANTED[@]}"; do
              trimmed=$(echo "$b" | xargs)
              [ -n "$trimmed" ] && SELECTED+=("$trimmed")
            done
            BRANCHES_JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -s -c .)
          else
            BRANCHES_JSON=$(printf '%s\n' "$ALL_BRANCHES" | jq -R . | jq -s -c .)
          fi

          echo "Branches selected: $BRANCHES_JSON"
          echo "branches=$BRANCHES_JSON" >> "$GITHUB_OUTPUT"

  sync-branch:
    needs: discover-branches
    if: needs.discover-branches.outputs.branches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover-branches.outputs.branches) }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Attempt merge from main
        id: merge
        run: |
          set +e
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          MERGE_EXIT=$?
          set -e

          if [ $MERGE_EXIT -ne 0 ]; then
            git merge --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "::error title=Merge conflict::Branch '${{ matrix.branch }}' conflicts with main - skipped, needs manual resolution"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "Branch '${{ matrix.branch }}' merged cleanly with main"
          fi

      - name: Push updated branch
        if: steps.merge.outputs.status == 'success' && github.event.inputs.dry_run == 'false'
        run: git push origin HEAD:${{ matrix.branch }}

      - name: Record result
        if: always()
        run: |
          mkdir -p /tmp/status
          cat > /tmp/status/result.json <<EOF
          {"branch": "${{ matrix.branch }}", "status": "${{ steps.merge.outputs.status }}", "pushed": "${{ steps.merge.outputs.status == 'success' && github.event.inputs.dry_run == 'false' }}"}
          EOF

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-status-${{ strategy.job-index }}
          path: /tmp/status/result.json
          retention-days: 1

  summarize:
    needs: [discover-branches, sync-branch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sync-status-*
          path: /tmp/all-status
          merge-multiple: true
        continue-on-error: true

      - name: Build summary report
        run: |
          set -euo pipefail
          {
            echo "## 🔄 Branch Sync Report"
            echo ""
            echo "Dry run: **${{ github.event.inputs.dry_run }}**"
            echo ""
            echo "| Branch | Result | Pushed |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          CONFLICTS=""

          if [ -d /tmp/all-status ]; then
            for f in /tmp/all-status/*.json; do
              [ -e "$f" ] || continue
              BRANCH=$(jq -r .branch "$f")
              STATUS=$(jq -r .status "$f")
              PUSHED=$(jq -r .pushed "$f")
              ICON="✅"
              if [ "$STATUS" == "conflict" ]; then
                ICON="⚠️"
                CONFLICTS="${CONFLICTS} \`${BRANCH}\`"
              fi
              echo "| $BRANCH | $ICON $STATUS | $PUSHED |" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          if [ -n "$CONFLICTS" ]; then
            {
              echo ""
              echo "### ⚠️ Needs manual attention"
              echo "These branches conflict with main and were skipped:$CONFLICTS"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
